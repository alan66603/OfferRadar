locations:
  - Hsinchu
  - Taipei
  - Melbourne
  - Singapore
  - Remote

work_types:
  - remote
  - hybrid
  - onsite

job_type: both          # 'full-time' | 'internship' | 'both'

salary_min_twd: null          # set to integer to filter by annual salary, null = no filter

visa_sponsorship_required: false

max_years_experience: 2       # exclude jobs requiring 2+ years experience; null = off

keywords_must:                # job must contain at least one of these
  - Cloud
  - DevOps
  - DevSecOps
  - Site Reliability
  - SRE
  - Platform
  - Infrastructure
  - Software Engineer
  - Backend
  - Python
  - Full Stack

keywords_nice:                # boost score if present
  - AWS
  - GCP
  - Azure
  - Terraform
  - Ansible
  - Docker
  - Kubernetes
  - CI/CD
  - GitHub Actions
  - Serverless
  - Lambda
  - Prometheus
  - Grafana
  - Alertmanager
  - OpenTelemetry
  - Observability
  - Linux
  - Bash
  - TypeScript
  - Java
  - FastAPI
  - Node.js
  - React
  - Vue
  - MongoDB
  - pytest
  - MCP
  - LLM
  - Data Pipeline
  - Data Engineering
  - MLOps
  - AI

keywords_exclude:             # immediately discard jobs containing any of these
  - Firmware
  - Hardware
  - FPGA
  - VHDL
  - Mainframe
  - COBOL
  - Australian Citizen
  - Permanent Resident Only
  - Security Clearance
  - Must be PR

days_back: 1                  # how many days of emails to fetch

digest_email: alan66603@gmail.com
max_digest_jobs: 10
llm_score_threshold: 6.0      # minimum Claude score to include in digest
kw_score_threshold: 0.2       # minimum keyword score to pass to Layer 2
